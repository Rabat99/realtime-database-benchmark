services:
  postgres:
    cpuset: "${PG_CPUS:-0}"
    image: ${POSTGRES_IMAGE:-postgres:16}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=16
      - -c
      - max_wal_senders=16
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-1GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - benchmark_pgdata:/var/lib/postgresql/data
      - ../shared:/bench:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 30

  hasura:
    cpuset: "${HASURA_CPUS:-1}"
    image: hasura/graphql-engine:v2.42.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HASURA_PORT:-8080}:8080"
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET}

      # Normale Live Queries; messages_stream wird nicht verwendet.
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "1000"
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: "100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

volumes:
  benchmark_pgdata:
    name: realtime_benchmark_pgdata
